version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - godot
    - govet
    - ineffassign
    - prealloc
    - staticcheck
    - unused
    - whitespace
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
