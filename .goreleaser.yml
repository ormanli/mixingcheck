version: 2
project_name: mixingcheck
before:
  hooks:
    - go mod tidy
builds:
  - goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - "386"
      - arm64
    goarm:
      - 6
      - 7
    main: ./main.go
    ldflags: -s -w -X internal/check.Version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    binary: mixingcheck
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}Darwin
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
snapshot:
  version_template: SNAPSHOT-{{ .Commit }}
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
signs:
  -
    cmd: gpg
    args:
      - --output
      - $signature
      - --detach-sig
      - $artifact
    signature: ${artifact}.sig
    artifacts: none
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  draft: true
brews:
  -
    repository:
      owner: ormanli
      name: mixingcheck
    description: "Golang static analyzer to check forbidden structs and method calls"
    homepage: "https://github.com/ormanli/mixingcheck"
    directory: Formula
    install: bin.install "mixingcheck"
    test: |
      system "#{bin/mixingcheck}"
